<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election · GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
<style>
details.h2h { margin-top: 2.5rem; }
details.h2h > summary { list-style-position: inside; }
details.h2h > summary h2 { display: inline; }
.h2h-controls { display: flex; flex-wrap: wrap; gap: .4rem 2rem; margin: .8rem 0; }
.h2h-opts { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .2rem 1rem; align-items: center; }
.h2h-opts legend { float: left; margin-right: .2rem; padding: 0; }
.h2h-opts label { white-space: nowrap; }
.h2h-methods th { text-align: left; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: inherit; color: var(--muted); white-space: normal; }
.pairwise td.pw { text-align: center; }
.pairwise td.pw b { display: inline-flex; align-items: center; justify-content: center; min-width: 2.2rem; height: 2rem; padding: 0 .3rem; border-radius: 7px; font-weight: 400; font-variant-numeric: tabular-nums; }
.pairwise td.win b { background: color-mix(in oklab, var(--good) 28%, transparent); }
.pairwise td.loss b { color: var(--muted); }
.pairwise td.tie b { outline: 1px dashed var(--rule); }
.pairwise td.self { color: var(--muted); }
.pairwise .out, .pairwise th.out { opacity: .45; }
.pairwise tbody .voter { font-size: .85rem; }
.pairwise thead th.voter { white-space: normal; }
</style>
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/" aria-label="GEB Club"><canvas aria-hidden="true"></canvas></a>
  <a href="/history">History</a>
  <a href="/members/" aria-current="page">Members</a>
</nav></header>
<main id="main"><p class="muted">Loading…</p></main>
<script type="module">
import { api, el, fmt, pill, bookCard, bookSearch, getMe, who, thumb, coverUrl } from './app.js';
import { analyze, copelandScore } from './condorcet.js';
import { contributions, voterColors } from './contrib.js';

const id = new URLSearchParams(location.search).get('id');
const main = document.getElementById('main');
let members = [];
let me = null;

async function load() {
  const [data, ms, m] = await Promise.all([api(`/api/elections/${id}`), api('/api/members'), getMe()]);
  members = ms;
  me = m;
  const { election: e, candidates, ballots, methods, live, book, debtWeights } = data;
  document.title = `${e.title} · GEB Club`;
  const head = [
    el('p.small.back', el('a', { href: '/members/current' }, '← All elections')),
    el('h1', e.title, ' ', pill(e.status)),
    el('p.muted', el('a', { href: '/voting' }, methods[e.method] ?? e.method),
      admin() && e.status !== 'closed' && [' · ', action('Rename', async () => {
        const title = prompt('Election name', e.title)?.trim();
        if (title && title !== e.title) await api(`/api/elections/${id}`, { method: 'PATCH', body: { title } });
      }, '.link.small')]),
  ];
  const body = e.status === 'nominating' ? nominating(e, candidates)
    : e.status === 'voting' ? await voting(e, candidates, ballots, live, debtWeights)
    : results(e, candidates, ballots, book, debtWeights);
  main.replaceChildren(...[...head, ...body].flat(Infinity).filter((n) => n != null && n !== false && n !== ''));
}

const action = (label, fn, cls = '') => el(`button${cls}`, { type: 'button', onclick: async (ev) => {
  ev.target.disabled = true;
  try { await fn(); await load(); } catch (err) { alert(err.message); ev.target.disabled = false; }
} }, label);

const signInLink = () => el('p', el('a', { href: '/members/' }, 'Sign in'), ' to take part.');

const admin = () => !!me?.is_admin;
const memberSelect = (selectedId, attrs = {}) => el('select', attrs,
  el('option', { value: '' }, 'Nobody'),
  members.map((m) => el('option', { value: m.id, selected: m.id === selectedId }, m.name)));

// Admins: edit a book's details, swap in another edition from the search, or change who nominated it.
function editBook(c) {
  const f = {
    title: el('input', { id: `e${c.id}-title`, value: c.title, required: true, style: 'width:100%' }),
    author: el('input', { id: `e${c.id}-author`, value: c.author ?? '', style: 'width:100%' }),
    year: el('input', { id: `e${c.id}-year`, value: c.year ?? '', inputMode: 'numeric', style: 'width:6rem' }),
    nominator: memberSelect(c.nominator_id, { id: `e${c.id}-nominator` }),
    pitch: el('textarea', { id: `e${c.id}-pitch`, value: c.pitch ?? '', rows: 3, style: 'width:100%' }),
  };
  const lbl = (k, text) => el('label', { htmlFor: `e${c.id}-${k}` }, text);
  let edition = {};
  const picked = el('p.small.muted');
  const search = bookSearch((book) => {
    edition = { ol_key: book.ol_key, cover_id: book.cover_id, isbn: book.isbn };
    f.title.value = book.title; f.author.value = book.author; f.year.value = book.year ?? '';
    picked.textContent = `Cover and links will come from the ${book.title} record you picked.`;
  });
  const msg = el('p.small.error', { role: 'alert' });
  const form = el('form', search, picked,
    el('div.row', el('div', lbl('title', 'Title'), f.title), el('div', lbl('author', 'Author'), f.author)),
    el('div.row', el('div', lbl('year', 'Year'), f.year), el('div', lbl('nominator', 'Nominated by'), f.nominator)),
    lbl('pitch', 'Pitch'), f.pitch,
    el('p', el('button', 'Save')), msg);
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const year = f.year.value.trim();
    try {
      await api(`/api/elections/${id}/candidates/${c.id}`, { method: 'PATCH', body: {
        ...edition, title: f.title.value, author: f.author.value, pitch: f.pitch.value,
        year: year ? Number(year) : null, nominator_id: f.nominator.value ? Number(f.nominator.value) : null } });
      await load();
    } catch (err) { msg.textContent = err.message; }
  });
  return el('details', el('summary.small', 'Edit'), form);
}

// Each member sees the books in their own order (so no book always sits first), stable across reloads.
const hash = (s) => {
  let h = 2166136261;
  for (const ch of s) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); // mix so the last character matters
  return (h ^ (h >>> 16)) >>> 0;
};
const myOrder = (e, candidates) => me
  ? [...candidates].sort((x, y) => hash(`${e.id}:${me.id}:${x.id}`) - hash(`${e.id}:${me.id}:${y.id}`))
  : candidates;

// ---------------------------------------------------------------- nominating
function nominating(e, candidates) {
  const list = [
    el('h2', `Books (${candidates.length})`),
    candidates.length ? myOrder(e, candidates).map((c) => el('div.card', bookCard(c, [
      c.nominator && el('div.small.muted', `Nominated by ${c.nominator}`),
      me && action('Remove', () => confirm(`Remove ${c.title}?`) && api(`/api/elections/${id}/candidates/${c.id}`, { method: 'DELETE' }), '.link.small'),
      admin() && editBook(c),
    ]))) : el('p.muted', 'None'),
  ];
  if (!me) return [...list, signInLink()];

  const msg = el('p.error.small', { role: 'alert' });
  const f = {
    title: el('input', { id: 'n-title', required: true, style: 'width:100%' }),
    author: el('input', { id: 'n-author', style: 'width:100%' }),
    pitch: el('textarea', { id: 'n-pitch', rows: 2, style: 'width:100%' }),
    nominator: admin() ? memberSelect(me.id, { id: 'n-nominator' }) : null,
  };
  let picked = {};
  const preview = el('div');
  const showPick = () => preview.replaceChildren(picked.ol_key ? el('div.card', bookCard(picked)) : '');
  const search = bookSearch((book) => {
    picked = book; f.title.value = book.title; f.author.value = book.author; showPick();
  });
  // If someone edits the title by hand after picking, drop the linked record.
  f.title.addEventListener('input', () => { if (picked.ol_key) { picked = {}; showPick(); } });

  const form = el('form.card',
    el('h3', 'Add a book'),
    search, preview,
    el('div.row',
      el('div', el('label', { htmlFor: 'n-title' }, 'Title'), f.title),
      el('div', el('label', { htmlFor: 'n-author' }, 'Author'), f.author)),
    el('label', { htmlFor: 'n-pitch' }, 'Pitch (optional)'), f.pitch,
    f.nominator && [el('label', { htmlFor: 'n-nominator' }, 'Nominated by'), f.nominator],
    el('p', el('button', 'Add book')), msg);
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    try {
      await api(`/api/elections/${id}/candidates`, { method: 'POST', body: {
        ...picked, title: f.title.value, author: f.author.value, pitch: f.pitch.value,
        ...(f.nominator?.value ? { nominator_id: Number(f.nominator.value) } : {}) } });
      await load();
    } catch (err) { msg.textContent = err.message; }
  });

  return [
    ...list,
    form,
    el('div.actions', action('Open voting', () => api(`/api/elections/${id}`, { method: 'PATCH', body: { status: 'voting' } })),
      action('Delete election', async () => {
        if (!confirm('Delete this election and all its nominations?')) return;
        await api(`/api/elections/${id}`, { method: 'DELETE' });
        location.href = '/members/current';
      }, '.secondary')),
  ];
}

// ---------------------------------------------------------------- voting
async function voting(e, candidates, ballots, live, debtWeights) {
  const voted = new Set(ballots.map((b) => String(b.member_id)));
  const votedList = [
    el('h2', `Voted (${ballots.length})`),
    members.length ? el('ul.voters', [...members].sort((x, y) => voted.has(String(y.id)) - voted.has(String(x.id)))
      .map((m) => el(voted.has(String(m.id)) ? 'li.in' : 'li', { title: voted.has(String(m.id)) ? 'Voted' : 'Not yet' }, who(m.name)))) : '',
  ];
  if (!me) return [el('h2', 'Ballot'), signInLink(), ...votedList];

  const { scores: cast } = await api(`/api/elections/${id}/ballot`);
  // Picks not yet submitted are kept in this browser, so leaving the page doesn't lose them.
  const DRAFT = `geb-ballot-${id}-${me.id}`;
  const draft = (() => { try { return JSON.parse(localStorage.getItem(DRAFT)); } catch { return null; } })();
  const clearDraft = () => { try { localStorage.removeItem(DRAFT); } catch {} };
  const valid = (v) => Number.isInteger(v) && v >= 0 && v <= 5;
  const unsent = draft && candidates.some((c) => valid(draft[c.id]) && draft[c.id] !== cast?.[c.id]);
  const scores = unsent ? { ...cast, ...Object.fromEntries(candidates.filter((c) => valid(draft[c.id])).map((c) => [c.id, draft[c.id]])) } : cast;
  const msg = el('p.small.error', { role: 'alert' });
  const count = el('span.count.small.muted', { role: 'status' });
  const form = el('form',
    myOrder(e, candidates).map((c) => el('div.card', bookCard(c, [
      c.nominator && el('div.small.muted', `Nominated by ${c.nominator}`),
      el('div.scores', { role: 'radiogroup', 'aria-label': `Score for ${c.title}` },
        [0, 1, 2, 3, 4, 5].map((s) => el('label',
          el('input', { type: 'radio', name: `c${c.id}`, value: s, checked: scores?.[c.id] === s, required: true }),
          el('span', s)))),
      admin() && editBook(c),
    ]))),
    msg,
    el('div.ballot-bar', el('button', cast ? 'Update ballot' : 'Submit ballot'),
      cast && action('Withdraw', async () => {
        if (!confirm('Withdraw your ballot?')) return;
        await api(`/api/elections/${id}/ballot`, { method: 'DELETE' });
        clearDraft();
      }, '.secondary'),
      count));
  const picks = () => Object.fromEntries([...new FormData(form)].map(([k, v]) => [k.slice(1), Number(v)]));
  const tick = () => {
    const p = picks(), n = Object.keys(p).length;
    const changed = candidates.some((c) => p[c.id] !== undefined && p[c.id] !== cast?.[c.id]);
    count.textContent = `${n} / ${candidates.length}${changed ? ' · not submitted' : ''}`;
  };
  form.addEventListener('change', () => { try { localStorage.setItem(DRAFT, JSON.stringify(picks())); } catch {} tick(); });
  tick();
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(form);
    const body = { scores: Object.fromEntries(candidates.map((c) => [c.id, Number(fd.get(`c${c.id}`))])) };
    try {
      await api(`/api/elections/${id}/ballot`, { method: 'PUT', body });
      clearDraft();
      await load();
    } catch (err) { msg.textContent = err.message; }
  });

  return [
    el('h2', 'Ballot'),
    el('p.small', 'Voting as ', el('strong', who(me.name)), cast ? el('span.ok', ' · voted') : ''),
    form,
    ...votedList,
    admin() && [el('h2', 'Count so far'),
      live ? tallyView(e, candidates, ballots, live, live.winner, 'Winning now',
        (bl) => action('Remove', () => confirm(`Remove ${bl.name}'s ballot?`) && api(`/api/elections/${id}/ballots/${bl.member_id}`, { method: 'DELETE' }), '.link.small'))
        : el('p.muted', 'No ballots yet'),
      live && headToHead(e, candidates, ballots, debtWeights, live.winner)],
    !admin() && cast && live && [el('h2', 'Count so far'), tallyView(e, candidates, null, live, live.winner, 'Winning now')],
    el('div.actions',
      action('Close voting and count', async () => {
        if (!confirm('Close voting and count? This cannot be undone.')) return;
        await api(`/api/elections/${id}/close`, { method: 'POST', body: {} });
      }),
      action('Back to nominating', () => api(`/api/elections/${id}`, { method: 'PATCH', body: { status: 'nominating' } }), '.secondary')),
  ];
}

// ---------------------------------------------------------------- results
const results = (e, candidates, ballots, book, debtWeights) => {
  const [winner, ...rest] = tallyView(e, candidates, ballots, e.result, e.winner_id, 'Winner');
  return [winner, book && el('p.small', el('a', { href: `/members/book?id=${book.id}` }, 'Notes and favorites')), ...rest,
    headToHead(e, candidates, ballots, debtWeights, e.winner_id)];
};

// ---------------------------------------------------------------- head to head
// Collapsed at the end: every pair of books, and who Condorcet methods would pick,
// with or without debt weights, from all books or only the Smith or Schwartz set.
function headToHead(e, candidates, ballots, debtWeights, winnerId) {
  if (!ballots?.length || candidates.length < 2 || !ballots[0].scores) return '';
  const byId = Object.fromEntries(candidates.map((c) => [String(c.id), c]));
  const ids = candidates.map((c) => String(c.id));
  const votes = ballots.map((b) => ({ voter: String(b.member_id), scores: b.scores }));
  const title = (cid) => byId[cid]?.title ?? '?';
  const names = (xs) => xs.map(title).join(', ');
  const key = `h2h-${e.id}`;
  let weighting = debtWeights && e.method === 'debt-star' ? 'debt' : 'equal', filter = 'all';

  const radios = (name, legend, options, current, set) => el('fieldset.h2h-opts',
    el('legend.small.muted', legend),
    options.map(([value, label]) => el('label',
      el('input', { type: 'radio', name: `${key}-${name}`, value, checked: value === current, onchange: () => { set(value); draw(); } }),
      ' ', label)));

  const body = el('div');
  const draw = () => {
    const r = analyze(ids, votes, weighting === 'debt' ? debtWeights : {}, filter);
    const inField = new Set(r.field);
    const rows = [...ids].sort((a, b) => copelandScore(ids, r.d, b) - copelandScore(ids, r.d, a));
    const record = (a) => {
      let w = 0, l = 0, t = 0;
      for (const b of ids) if (b !== a) { const x = r.d[a][b] - r.d[b][a]; if (Math.abs(x) < 1e-9) t++; else if (x > 0) w++; else l++; }
      return `${w}–${l}${t ? `–${t}` : ''}`;
    };
    const outcome = (ws) => (!ws.length ? el('span.muted', 'none: no book beats every other')
      : ws.length > 1 ? ['Tie: ', names(ws)]
      : el(ws[0] === String(winnerId) ? 'strong' : 'span', title(ws[0])));
    body.replaceChildren(
      el('div.table-wrap', el('table.h2h-methods',
        el('tbody', r.methods.map((m) => el('tr', el('th', { scope: 'row' }, m.label), el('td', outcome(m.winners))))))),
      el('p.small', el('strong', 'Smith set: '), names(r.smith), el('br'), el('strong', 'Schwartz set: '), names(r.schwartz)),
      el('div.table-wrap.breakout', el('table.ballots.pairwise',
        el('thead', el('tr', el('th.voter', 'Row over column'), el('th.num', 'Record'),
          rows.map((c) => el(`th.cand${inField.has(c) ? '' : '.out'}`, { title: title(c), scope: 'col' },
            thumb(byId[c].cover_url || coverUrl(byId[c].cover_id, 'S')), el('span', title(c)))))),
        el('tbody', rows.map((a) => el(`tr${inField.has(a) ? '' : '.out'}`,
          el('th.voter', { scope: 'row', title: title(a) }, title(a)),
          el('td.num', record(a)),
          rows.map((b) => {
            if (a === b) return el('td.pw.self', '—');
            const x = r.d[a][b] - r.d[b][a];
            const cls = Math.abs(x) < 1e-9 ? 'tie' : x > 0 ? 'win' : 'loss';
            return el(`td.pw.${cls}`, { title: `${title(a)} over ${title(b)}: ${fmt(r.d[a][b])} to ${fmt(r.d[b][a])}` }, el('b', fmt(r.d[a][b])));
          })))))),
    );
  };
  draw();

  return el('details.h2h',
    el('summary', el('h2', 'Head to head')),
    el('p.small.muted', 'Each cell is how much voting weight scored the row\'s book above the column\'s book (equal scores count for neither). ',
      'Green: the row book wins that pair. Methods choose from the books in the field; the STAR winner is in bold.',
      e.method !== 'debt-star' && debtWeights ? ' This election used plain STAR; debt weights are what each voter would have had.' : ''),
    el('div.h2h-controls',
      debtWeights && radios('w', 'Weighting', [['debt', 'Debt-weighted'], ['equal', 'One vote each']], weighting, (v) => (weighting = v)),
      radios('f', 'Field', [['all', 'All books'], ['smith', 'Smith set'], ['schwartz', 'Schwartz set']], filter, (v) => (filter = v))),
    body);
}

// One voter highlighted on every bar, the legend and the ballots table (hover, focus or tap; tap again to let go).
let pinned = null;
const highlight = (voter) => {
  main.classList.toggle('voter-hl', voter != null);
  for (const n of main.querySelectorAll('[data-voter]')) n.classList.toggle('hl', n.dataset.voter === voter);
};
const hoverable = (voter) => ({
  'data-voter': voter,
  onmouseenter: () => highlight(voter), onmouseleave: () => highlight(pinned),
  onclick: () => { pinned = pinned === voter ? null : voter; highlight(pinned); },
});

// The count: winner, scoring round, runoff and every ballot. Used for closed elections, and for
// admins while voting is open (ballotAction adds a control to each ballot row). With ballots null
// (members who have voted, while voting is open) the ballot table is left out.
function tallyView(e, candidates, ballots, r, winnerId, winnerLabel, ballotAction) {
  const byId = Object.fromEntries(candidates.map((c) => [String(c.id), c]));
  const title = (cid) => byId[cid]?.title ?? '?';
  const winner = byId[String(winnerId)];
  const maxTotal = Math.max(...Object.values(r.totals), 1);
  const [a, b] = r.finalists;
  const weighted = r.method === 'debt-star';

  const cover = (c) => thumb(c.cover_url || coverUrl(c.cover_id, 'S'));
  const isWinner = (c) => String(c.id) === String(winnerId);
  const runoffTotal = b ? (r.runoff[a] + r.runoff[b] + r.runoff.noPreference) || 1 : 1;
  const side = (cid) => el(`div.side${String(cid) === String(winnerId) ? '' : '.lost'}`, el('span.n', fmt(r.runoff[cid])), title(cid));

  // With the ballots shown, each bar is split into one colored part per voter.
  pinned = null;
  main.classList.remove('voter-hl');
  const parts = ballots?.length ? contributions(candidates, ballots, r.weights ?? {}, r.finalists) : null;
  const colors = parts ? voterColors(ballots) : {};
  const nameOf = Object.fromEntries((ballots ?? []).map((bl) => [String(bl.member_id), bl.name]));
  const seg = (p, label, color = colors[p.voter]) => el('i.seg', { ...hoverable(p.voter), title: `${nameOf[p.voter]}: ${label}`,
    style: `flex:${p.value} 1 0${color ? `;background:${color}` : ''}` });
  const scoreLabel = (p) => (weighted ? `${p.score} × ${fmt(p.weight)} = ${fmt(p.value)}` : String(p.score));
  const legend = parts && el('ul.legend', ballots.map((bl) => {
    const v = String(bl.member_id);
    return el('li', el('button.chip', { type: 'button', ...hoverable(v), onfocus: () => highlight(v), onblur: () => highlight(pinned) },
      el('span.swatch', { style: `background:${colors[v]}` }), who(bl.name)));
  }));
  const runoffPart = (key, cls) => el(`i.${cls}${parts ? '.parts' : ''}`, { style: `flex:${r.runoff[key === 'none' ? 'noPreference' : key] / runoffTotal}` },
    parts && parts.runoff[key].map((p) => key === 'none' ? seg(p, 'no preference', null) : seg(p, fmt(p.value))));

  return [
    el('div.card.winner-card', el('div.eyebrow', winnerLabel), bookCard(winner)),
    weighted && r.plainStarWinner !== String(winnerId)
      ? el('p.callout.small', `Plain STAR winner: ${title(r.plainStarWinner)}`) : '',
    r.tiebreaks.map((t) => el('p.callout.small',
      `${t.round === 'runoff' ? 'Runoff' : 'Scoring round'} tie: ${t.tied.map(title).join(', ')}. Broken by ${t.how}.`)),

    el('h2', 'Scoring round'),
    legend,
    el('div.tally', [...candidates].sort((x, y) => r.totals[y.id] - r.totals[x.id]).map((c) => {
      const fin = r.finalists.includes(String(c.id)) ? '.fin' : '';
      return [
        el(`div.name${fin}`, cover(c), el('span', c.title, fin ? el('span.muted.small', { style: 'font-weight:400' }, ' · finalist') : '')),
        el(`div.track${fin}`, el(`div.bar${parts ? '.parts' : ''}`, { style: `width:${(100 * r.totals[c.id]) / maxTotal}%` },
          parts && parts.scoring[String(c.id)].map((p) => seg(p, scoreLabel(p))))),
        el(`div.val${fin}`, fmt(r.totals[c.id]))];
    })),

    b ? [el('h2', 'Runoff'),
      el('div.runoff',
        el('div.sides', side(a), side(b)),
        el('div.split', { role: 'img', 'aria-label': `${title(a)} ${fmt(r.runoff[a])}, ${title(b)} ${fmt(r.runoff[b])}, no preference ${fmt(r.runoff.noPreference)}` },
          runoffPart(a, 'a'), runoffPart('none', 'none'), runoffPart(b, 'b')),
        el('div.mid.muted.small', `No preference ${fmt(r.runoff.noPreference)}`))] : '',

    ballots && el('h2', `Ballots (${ballots.length})`),
    ballots && el('div.table-wrap.breakout', el('table.ballots',
      el('thead', el('tr', el('th.voter', 'Voter'), weighted && el('th.num', 'Debt'), el('th.num', 'Weight'),
        candidates.map((c) => el(`th.cand${isWinner(c) ? '.won' : ''}`, { title: c.title, scope: 'col' }, cover(c), el('span', c.title))))),
      el('tbody', ballots.map((bl) => el('tr', parts ? { ...hoverable(String(bl.member_id)), style: `--vc:${colors[String(bl.member_id)]}` } : {},
        el('th.voter', { scope: 'row', title: bl.name }, who(bl.name), ballotAction && ballotAction(bl)),
        weighted && el('td.num', fmt(r.debts?.[bl.member_id])),
        el('td.num', fmt(r.weights[bl.member_id])),
        candidates.map((c) => { const v = bl.scores[c.id] ?? 0; return el(`td.sc.s${v}${isWinner(c) ? '.won' : ''}`, el('b', v)); })))))),
    weighted ? el('p.muted.small', `β = ${r.params.beta}, floor = ${r.params.floor}.`, e.closed_at ? ` Closed ${e.closed_at} UTC.` : '') : '',
  ];
}

load().catch((err) => main.replaceChildren(el('p.error', err.message)));
</script>
<script src="/nav.js" defer></script>
</body>
</html>
