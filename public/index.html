<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
<style>
  .home { max-width: 1100px; text-align: center; overflow: hidden; padding-top: 2.5rem; position: relative; }
  /* lines from each word of the name to the cover of the book that contributed it */
  .links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  .links path { fill: none; stroke-linecap: round; transition: opacity .3s; }
  .links .halo { stroke: var(--paper); stroke-width: 4; opacity: .75; }
  .links .old { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .8; }
  .links .new { stroke: var(--accent); stroke-width: 1.6; opacity: .9; }
  .links circle { fill: var(--accent); }
  .geb, .names { position: relative; z-index: 3; }
  .geb .w.new, .geb .w.new .rest { color: var(--accent); }

  /* GEB -> Gödel Escher Bach */
  /* G, E and B sit at evenly spaced positions: each word gets an equal third and starts at its left edge */
  .geb { font-size: clamp(3.2rem, 11vw, 7.5rem); font-weight: 600; letter-spacing: .02em; margin: 0 auto; line-height: 1;
    display: grid; grid-template-columns: repeat(3, 1fr); width: min(100%, 980px); text-align: left; cursor: default; user-select: none; }
  .geb .w { display: inline-flex; align-items: baseline; min-width: 0; white-space: nowrap; padding-left: 4%; }
  .geb .rest { display: inline-block; flex-shrink: 0; max-width: 0; overflow: hidden; opacity: 0; font-size: calc(.42em * var(--rest-scale, 1)); font-style: italic;
    font-weight: 400; color: var(--muted); transition: max-width .7s ease, opacity .5s ease; white-space: nowrap; }
  .geb:hover .rest, .geb:focus .rest, .geb.open .rest { max-width: 16em; opacity: 1; }
  .geb .w.wrap .rest { white-space: normal; line-height: 1.05; align-self: flex-end; }
  .geb .w:nth-child(2) .rest { transition-delay: .08s; }
  .geb .w:nth-child(3) .rest { transition-delay: .16s; }
  .geb:focus { outline: none; }
  .geb .w { transition: color .4s; }
  .geb .w.changed { animation: rotate-in .55s cubic-bezier(.2,.7,.2,1); }
  @keyframes rotate-in { from { opacity: 0; transform: translateY(.35em) rotateX(70deg); } to { opacity: 1; transform: none; } }
  .names { display: inline-flex; align-items: center; gap: .9rem; margin-top: .6rem; }
  .names button { background: none; border: 0; color: var(--muted); font-size: 1.1rem; padding: 0 .3rem; cursor: pointer; }
  .names button:hover { color: var(--accent); }
  .names button[hidden] { display: none; }
  .club { display: inline-block; font-size: .95rem; letter-spacing: .5em; text-transform: uppercase; color: var(--muted); padding-left: .5em; }

  /* the strange loop: every book on a turning ring */
  .stage { --w: 104px; --h: 156px; --r: 380px; height: calc(var(--h) * 2.3); perspective: 1400px; perspective-origin: 50% 30%;
    position: relative; z-index: 1; margin-top: 1.5rem; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
  .stage.dragging { cursor: grabbing; }
  .floor { position: absolute; left: 50%; top: 62%; width: calc(var(--r) * 2.3); height: calc(var(--r) * .5);
    transform: translate(-50%, 0); background: radial-gradient(ellipse at center, rgba(0,0,0,.18), transparent 65%); pointer-events: none; }
  .ring { position: absolute; left: 50%; top: 18%; width: var(--w); height: var(--h); margin-left: calc(var(--w) / -2);
    transform-style: preserve-3d; transform: rotateX(-9deg) rotateY(0deg); will-change: transform; }
  .ring-book { position: absolute; inset: 0; transform-style: preserve-3d; display: block; }
  /* each cover keeps its own proportions, standing on the bottom of its slot (no cropping) */
  .ring-book .face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .ring-book .face img { display: block; max-width: 100%; max-height: 100%; border-radius: 3px; box-shadow: 0 10px 22px -10px rgba(0,0,0,.55); }
  .ring-book .face img.crop { width: 100%; height: 100%; object-fit: cover; }  /* scans with extra margin, trimmed to 2:3 */
  .ring-book .face.back { transform: rotateY(180deg); filter: brightness(.45) saturate(.7); }
  .ring-book .face.front { transition: transform .25s ease; }
  .ring-book:hover .face.front, .ring-book:focus-visible .face.front { transform: translateZ(18px) scale(1.05); }
  .ring-book:focus-visible { outline: none; }
  .ring-book:focus-visible .face.front img { outline: 2px solid var(--accent); outline-offset: 3px; }
  .ring-book .blank { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: .5rem; font-size: .75rem; font-style: italic; color: var(--muted); background: var(--rule); border-radius: 3px; }

  /* color shelf: one column of cover colors per book, standing on a plank */
  .colors { display: flex; gap: 6px; align-items: flex-end; height: 104px; width: min(100%, var(--shelf-w, 900px)); margin: 1.75rem auto 0; padding: 0 8px; position: relative; z-index: 3;
    border-bottom: 6px solid var(--rule); border-radius: 0 0 3px 3px; }
  .colors .col { flex: 1; height: 80px; display: flex; flex-direction: column; padding: 0; border: 0; border-radius: 2px 2px 0 0; overflow: hidden; cursor: pointer; background: var(--rule);
    transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s; }
  .colors .col span { display: block; min-height: 2px; }
  .colors .col:hover { transform: translateY(-3px); }
  .colors .col.on { transform: translateY(-18px); box-shadow: 0 8px 10px -6px rgba(0,0,0,.45); }
  .colors .col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .colors .col { transition: none; } }
  .count { color: var(--muted); font-size: .95rem; margin-top: .5rem; }
  .count a { color: inherit; }

  @media (max-width: 640px) { .colors { height: 72px; gap: 3px; margin-top: 1rem; } .colors .col { height: 54px; } .colors .col.on { transform: translateY(-12px); } .stage { --w: 70px; --h: 105px; --r: 250px; } .club { letter-spacing: .35em; } }
  @media (prefers-reduced-motion: reduce) { .geb .rest { transition: none; } }
</style>
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/" aria-label="GEB Club"><canvas aria-hidden="true"></canvas></a>
  <a href="/history">History</a>
  <a href="/members/">Members</a>
</nav></header>
<main class="home">
  <svg class="links" id="links" aria-hidden="true"></svg>
  <h1 class="geb open" id="geb" aria-live="polite"></h1>
  <div><span class="names">
    <button type="button" id="older" aria-label="Previous book">‹</button>
    <span class="club" id="club"></span>
    <button type="button" id="newer" aria-label="Next book">›</button>
  </span></div>
  <div class="stage" id="stage" aria-label="Books we've read">
    <div class="floor"></div>
    <div class="ring" id="ring"></div>
  </div>
  <div class="colors" id="colors"></div>
  <p class="count" id="count"></p>
</main>
<script>
const make = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
// Club names, newest first. One word of G-E-B changes each book.
// chunks: the G, E and B words (first letter shown large). tail: what follows.
// book: the history position (#) the name belonged to. "…" = word not remembered.
// "|" marks where a long word may wrap on narrow screens (it is not displayed).
// Book 5 (Hunt, Gather, Parent): probably "baby".
const NAMES = [
  { chunks: ['great|and|secret|knowledge-', 'esk-', 'bacalao'], tail: 'club', book: 22 },
  { chunks: ['grief ', 'esk ', 'bacalao'], tail: 'club', book: 21 },
  { chunks: ['grief ', 'esk ', 'back2thefuture'], tail: 'club', book: 20 },
  { chunks: ['grief ', 'electronics ', 'back2thefuture'], tail: 'club', book: 19 },
  { chunks: ['galaxy ', 'electronics ', 'back2thefuture'], tail: 'club', book: 18 },
  { chunks: ['galaxy ', 'electronics ', 'byzantine'], tail: 'club', book: 17 },
  { chunks: ['galaxy ', 'ekumenical ', 'byzantine'], tail: 'club', book: 16 },
  { chunks: ['gospel ', 'ekumenical ', 'byzantine'], tail: 'club', book: 15 },
  { chunks: ['gospel ', 'erogenous ', 'byzantine'], tail: 'club', book: 14 },
  { chunks: ['garlic ', 'erogenous ', 'byzantine'], tail: 'club', book: 13 },
  { chunks: ['garlic ', 'erogenous ', 'bromance'], tail: 'club', book: 12 },
  { chunks: ['garlic ', 'enlightenment ', 'bromance'], tail: 'club', book: 11 },
  { chunks: ['ghostwriter ', 'enlightenment ', 'bromance'], tail: 'club', book: 10 },
  { chunks: ['ghostwriter ', 'enlightenment ', 'business'], tail: 'club', book: 9 },
  { chunks: ['ghostwriter ', 'espionage ', 'business'], tail: 'club', book: 8 },
  { chunks: ['guardship ', 'espionage ', 'business'], tail: 'club', book: 7 },
  { chunks: ['guardship ', 'espionage ', 'baby'], tail: 'club', book: 6 },
  { chunks: ['gathering ', 'espionage ', 'baby'], tail: 'club', book: 5 },
  { chunks: ['gathering ', 'espionage ', 'baru'], tail: 'club', book: 4 },
  { chunks: ['gathering ', 'escher ', 'baru'], tail: 'club', book: 3 },
  { chunks: ['gödel ', 'escher ', 'baru'], tail: 'club', book: 2 },
  { chunks: ['gödel ', 'escher ', 'bach'], tail: 'club', book: 1 },
];
let BOOKS = [];
const geb = document.getElementById('geb');
const plain = (c) => c.replace(/\|/g, '');
const word = (c) => plain(c).replace(/[-\s]+$/, '');
const nameFor = (position) => NAMES.find((n) => n.book === position);
// SOURCES[book][slot] = the book whose round introduced the G / E / B word in use during `book`
const SOURCES = {};
[...NAMES].sort((a, b) => a.book - b.book).forEach((n, i, all) => {
  const prev = all[i - 1];
  SOURCES[n.book] = n.chunks.map((c, k) => (prev && word(prev.chunks[k]) === word(c) ? SOURCES[prev.book][k] : n.book));
});
let shown = null;

// Show one club name; only the word that rotated since the last one animates.
let shownBook = null, shownFor = null;
function showName(n, book) {
  if (!n) return;
  shownBook = book;
  if (n === shown && book === shownFor) return;
  const prev = shown; shown = n; shownFor = book;
  const src = book ? SOURCES[book.position] : null;
  geb.replaceChildren(...n.chunks.map((c, k) => make('span', { className: ['w', prev && prev !== n && word(prev.chunks[k]) !== word(c) ? 'changed' : '', src && src[k] === book.position ? 'new' : ''].join(' ').trim() },
    c[0].toUpperCase(), make('span', { className: 'rest' }, ...c.slice(1).split('|').flatMap((part, j) => (j ? [document.createElement('wbr'), part] : [part]))))));
  geb.setAttribute('aria-label', `${n.chunks.map(plain).join('')} ${n.tail}`);
  document.getElementById('club').textContent = n.tail;
  fitName();
}

// Each word must fit in its third of the title, so G, E and B stay evenly spaced.
// A word that is too long shrinks its own lowercase part (down to 45%); if it still
// doesn't fit, its lowercase wraps (at the | marks) inside its third, no taller than the capital.
const MIN_SCALE = 0.45;
function fitName() {
  const words = [...geb.querySelectorAll('.w')];
  const col = geb.clientWidth / 3;
  for (const w of words) {
    const rest = w.querySelector('.rest');
    rest.style.transition = 'none';  // measure final sizes, not mid-animation ones
    requestAnimationFrame(() => requestAnimationFrame(() => rest.style.removeProperty('transition')));
    w.style.removeProperty('--rest-scale');
    w.classList.remove('wrap');
    rest.style.removeProperty('max-width');
    if (w.scrollWidth <= col + 0.5) continue;
    const fixed = w.scrollWidth - rest.scrollWidth;  // capital + padding
    let scale = Math.max(MIN_SCALE, Math.min(1, (col - fixed) / rest.scrollWidth));
    w.style.setProperty('--rest-scale', scale.toFixed(3));
    // italic text doesn't shrink exactly in proportion; nudge down until it really fits
    for (let k = 0; k < 14 && w.scrollWidth > col + 0.5 && scale > MIN_SCALE; k++) {
      scale = Math.max(MIN_SCALE, scale * 0.97);
      w.style.setProperty('--rest-scale', scale.toFixed(3));
    }
    if (w.scrollWidth > col + 0.5) {
      // wrap at the marked break points, then use the largest size whose lines stay within
      // the height of the capital letter
      w.classList.add('wrap');
      const capH = parseFloat(getComputedStyle(geb).fontSize) * 0.95;
      for (scale = 1; scale >= 0.3; scale *= 0.95) {  // on the narrowest screens, shrink rather than clip
        w.style.setProperty('--rest-scale', scale.toFixed(3));
        rest.style.maxWidth = `${Math.max(20, col - fixed - 2)}px`;
        if (w.scrollWidth <= col + 0.5 && rest.scrollWidth <= rest.clientWidth + 0.5 && rest.offsetHeight <= capH) break;
      }
    }
  }
}
addEventListener('resize', fitName);
showName(nameFor(1));

// The ring turns slowly on its own; drag or swipe to spin it (with momentum).
// The book at the front decides the club name shown above. A real mouse hovering
// pauses it; tapping a cover opens it unless you were dragging.
function spinRing(stage, ring, count, onFront, onFrame) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const AUTO = reduce ? 0 : -4;          // degrees per second (negative = forward in time)
  const DRAG = 0.35;                      // degrees per pixel dragged
  const STEP = 360 / count;
  let angle = 0;                          // start with GEB (the first book) at the front
  // linger on it for a few seconds after the page loads
  let vel = 0, hovering = false, drag = null, target = null, holdUntil = performance.now() + 3000, front = -1, last = performance.now();
  const frontIndex = () => ((Math.round(-angle / STEP) % count) + count) % count;
  const tick = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (target != null) {
      angle += (target - angle) * Math.min(1, dt / 0.18);
      if (Math.abs(target - angle) < 0.05) { angle = target; target = null; vel = 0; }
      if (target != null) holdUntil = Math.max(holdUntil, now + 50);
    } else if (!drag) {
      const idle = hovering || now < holdUntil ? 0 : AUTO;
      vel += (idle - vel) * Math.min(1, dt / 0.45);  // momentum fades back to the idle speed
      angle += vel * dt;
    }
    ring.style.transform = `rotateX(-9deg) rotateY(${angle}deg)`;
    const f = frontIndex();
    onFrame?.(angle, f);
    if (f !== front) {
      front = f; onFront(f);
      // the drift settles on GEB (the first book) for a few seconds each loop
      if (f === 0 && !drag && target == null && Math.abs(vel) <= Math.abs(AUTO) + 0.5 && AUTO) {
        target = -Math.round(-angle / STEP) * STEP; holdUntil = now + 3000 + 400;
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  stage.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') hovering = true; });
  stage.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hovering = false; });
  stage.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, lastX: e.clientX, lastT: e.timeStamp, moved: false, v: 0 };
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.lastX;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x) < 6) return;
      if (Math.abs(e.clientY - drag.y) > Math.abs(e.clientX - drag.x)) { drag = null; return; } // vertical: let the page scroll
      drag.moved = true; target = null; stage.classList.add('dragging'); try { stage.setPointerCapture(e.pointerId); } catch {}
    }
    angle += dx * DRAG;
    const dt = Math.max(8, e.timeStamp - drag.lastT) / 1000;
    drag.v = 0.7 * drag.v + 0.3 * (dx * DRAG / dt);
    drag.lastX = e.clientX; drag.lastT = e.timeStamp;
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.moved) {
      vel = Math.max(-220, Math.min(220, drag.v));  // a hard flick coasts at most ~100 degrees
      // swallow the click that follows a drag so it does not open a cover
      const swallow = (c) => { c.preventDefault(); c.stopPropagation(); };
      stage.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => stage.removeEventListener('click', swallow, { capture: true }), 80);
      setTimeout(() => stage.classList.remove('dragging'), 0);
    }
    drag = null;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.id) drag = null; stage.classList.remove('dragging'); });
  ring.addEventListener('dragstart', (e) => e.preventDefault());

  // Turn to the next/previous book and stay there a few seconds.
  return {
    // turn the shortest way to book i
    to(i) {
      const base = -i * STEP;
      target = base + Math.round((angle - base) / 360) * 360;
      holdUntil = performance.now() + 5000;
    },
    step(d) {
      const base = target != null ? target : -Math.round(-angle / STEP) * STEP;
      target = base - d * STEP;
      holdUntil = performance.now() + 5000;
    },
  };
}

fetch('/api/public/books').then(r => r.json()).then(books => {
  BOOKS = books;
  const stage = document.getElementById('stage'), ring = document.getElementById('ring');
  const n = books.length;
  // radius so neighbouring covers just clear each other
  const place = () => {
    const w = parseFloat(getComputedStyle(stage).getPropertyValue('--w'));
    const r = Math.max(w * 1.15 / 2 / Math.tan(Math.PI / n), w * 2);
    stage.style.setProperty('--r', `${r}px`);
    // the color shelf is as wide as the ring
    document.getElementById('colors').style.setProperty('--shelf-w', `${2 * r + w}px`);
    [...ring.children].forEach((c, i) => { c.style.transform = `rotateY(${(360 / n) * i}deg) translateZ(${r}px)`; });
  };
  const face = (b, cls) => make('span', { className: `face ${cls}` },
    b.cover_url ? make('img', { src: b.cover_url, alt: '', loading: 'eager', draggable: false, className: b.cover_url.endsWith('#crop') ? 'crop' : '' }) : make('span', { className: 'blank' }, b.title));
  ring.replaceChildren(...books.map(b => make('a', {
    className: 'ring-book', href: b.storygraph_url || '/history', target: '_blank', rel: 'noopener',
    title: `${b.title}${b.author ? ' · ' + b.author : ''}`, ariaLabel: b.title,
  }, face(b, 'front'), face(b, 'back'))));
  place();
  addEventListener('resize', place);

  const links = document.getElementById('links'), home = links.parentElement;
  const cards = [...ring.children], indexOf = Object.fromEntries(books.map((b, i) => [b.position, i]));
  const STEP = 360 / n;
  const svgEl = (tag) => links.appendChild(document.createElementNS('http://www.w3.org/2000/svg', tag));
  // each line has a halo in the page colour underneath so it reads over any cover
  const halos = [0, 1, 2].map(() => { const h = svgEl('path'); h.setAttribute('class', 'halo'); return h; });
  const paths = [0, 1, 2].map(() => svgEl('path'));
  const dots = [0, 1, 2].map(() => { const c = links.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'circle')); c.setAttribute('r', 2.5); return c; });
  const drawLinks = (angle, front) => {
    const pos = books[front].position, src = SOURCES[pos];
    if (!src) return;
    const box = home.getBoundingClientRect();
    const words = geb.querySelectorAll('.w');
    src.forEach((from, k) => {
      const i = indexOf[from], w = words[k];
      if (i == null || !w) { paths[k].setAttribute('d', ''); halos[k].setAttribute('d', ''); return; }
      // the cover's visible side: front face within 90 degrees of facing us, back face otherwise
      const facing = Math.cos(((i * STEP + angle) * Math.PI) / 180) > 0;
      const img = cards[i].querySelector(facing ? '.face.front img, .face.front .blank' : '.face.back img, .face.back .blank');
      if (!img) return;
      const a = w.getBoundingClientRect(), b = img.getBoundingClientRect();
      const x1 = a.left + a.width / 2 - box.left, y1 = a.bottom - box.top - a.height * 0.12;
      const x2 = b.left + b.width / 2 - box.left, y2 = b.top - box.top;
      const my = y1 + (y2 - y1) * 0.55;
      const d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
      paths[k].setAttribute('d', d); halos[k].setAttribute('d', d);
      halos[k].style.opacity = facing ? '' : '0.2';
      const isNew = from === pos;
      paths[k].setAttribute('class', isNew ? 'new' : 'old');
      paths[k].style.opacity = facing ? '' : '0.25';
      dots[k].setAttribute('cx', x2); dots[k].setAttribute('cy', y2);
      dots[k].style.display = isNew ? '' : 'none';
    });
  };
  let frontNow = 0;
  const spin = spinRing(stage, ring, n, (i) => {
    frontNow = i;
    showName(nameFor(books[i].position), books[i]);
    shelf.querySelectorAll('.col').forEach((c, k) => c.classList.toggle('on', k === i));
  }, drawLinks);

  // the color shelf: each cover's main colors, in reading order; the book at the front rises
  const shelf = document.getElementById('colors');
  import("/palette.js").then(({ coverPalettes }) => coverPalettes(books.map((b) => b.cover_url))).then((pals) => {
    shelf.replaceChildren(...books.map((b, i) => {
      const col = make('button', { type: 'button', className: `col${i === frontNow ? ' on' : ''}`, title: b.title, ariaLabel: b.title, onclick: () => spin.to(i) },
        ...(pals[i] ?? [{ rgb: [190, 184, 172], share: 1 }]).map((p) => make('span', { style: `flex: ${p.share}; background: rgb(${p.rgb.join(',')})` })));
      return col;
    }));
  }).catch(() => {});
  document.getElementById('older').onclick = () => spin.step(-1);
  document.getElementById('newer').onclick = () => spin.step(1);
  // scroll wheel / swipe on the title also turn the ring, one book at a time
  let wheelLock = 0;
  geb.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) < 4) return;
    e.preventDefault();
    if (Date.now() - wheelLock < 350) return;
    wheelLock = Date.now(); spin.step(e.deltaY > 0 ? -1 : 1);
  }, { passive: false });
  let touchX = null;
  geb.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  geb.addEventListener('touchend', (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 40) spin.step(dx < 0 ? 1 : -1);
  });

  const latest = books.at(-1);
  document.getElementById('count').append(
    make('a', { href: '/history' }, `${n} books`), ' · latest: ',
    make('a', { href: latest?.storygraph_url || '/history', target: '_blank', rel: 'noopener' }, make('cite', {}, latest?.title ?? '')));
});
</script>
<script src="/nav.js" defer></script>
</body>
</html>
