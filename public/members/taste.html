<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taste map · GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
<style>
  svg.map { width: 100%; height: auto; display: block; overflow: visible; }
  svg.map .axis { stroke: var(--rule); stroke-width: 1; }
  svg.map .end { fill: var(--muted); font-size: 12px; }
  svg.map .who circle { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
  svg.map .who.me circle { fill: var(--ink); }
  svg.map .who text { font-size: 13px; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
  svg.map .bk { opacity: .9; }
  svg.map .bk:hover { opacity: 1; }
  .pick { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  .pred .book { align-items: center; margin: .35rem 0; }
  .pred .tierchip { display: inline-block; min-width: 1.6rem; text-align: center; font-weight: 700; border: 1px solid var(--rule); border-radius: 4px; margin-right: .5rem; }
</style>
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/" aria-label="GEB Club"><canvas aria-hidden="true"></canvas></a>
  <a href="/history">History</a>
  <a href="/voting">How we vote</a>
  <a href="/members/">Members</a>
</nav></header>
<main class="wide" id="main"><p class="muted">Loading…</p></main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="module">
import { api, el, thumb, getMe } from './app.js';
import { tasteMap, predict, RANKED } from './tierstats.js';

const main = document.getElementById('main');
const [{ books, members, entries }, me] = await Promise.all([api('/api/tiers'), getMe()]);
const bookOf = Object.fromEntries(books.map((b) => [b.id, b]));
const nameOf = Object.fromEntries(members.map((m) => [m.id, m.first_name || m.name]));
const map = tasteMap(entries);
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); parent?.append(n); return n; };

const tip = document.getElementById('tip');
addEventListener('pointermove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = `${Math.min(innerWidth - r.width - 8, Math.max(8, e.clientX - r.width / 2))}px`;
  tip.style.top = `${e.clientY - r.height - 14}px`;
});

// Drawn at the width it is shown at, so labels stay readable on a phone.
function drawMap(W) {
  const small = W < 560, H = Math.round(W * (small ? 1.05 : 0.74)), P = small ? 44 : 70;
  const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, class: 'map', role: 'img', 'aria-label': 'Members and books placed by taste' });
  const mx = Math.max(...map.members.map((m) => Math.abs(m.x)), 1e-6), my = Math.max(...map.members.map((m) => Math.abs(m.y)), 1e-6);
  const bx = Math.max(...map.books.map((b) => Math.abs(b.x)), 1e-6), by = Math.max(...map.books.map((b) => Math.abs(b.y)), 1e-6);
  const X = (v, s) => W / 2 + (v / s) * (W / 2 - P), Y = (v, s) => H / 2 - (v / s) * (H / 2 - P);
  S('line', { x1: P / 2, x2: W - P / 2, y1: H / 2, y2: H / 2, class: 'axis' }, svg);
  S('line', { y1: P / 2, y2: H - P / 2, x1: W / 2, x2: W / 2, class: 'axis' }, svg);
  // name each end of each axis by the book that pulls hardest that way
  const ext = (key, sign) => map.books.reduce((a, b) => (sign * b[key] > sign * a[key] ? b : a));
  const end = (b, x, y, anchor) => { S('text', { x, y, 'text-anchor': anchor, class: 'end' }, svg).textContent = bookOf[b.id]?.title ?? ''; };
  end(ext('x', -1), 8, H / 2 - 8, 'start'); end(ext('x', 1), W - 8, H / 2 - 8, 'end');
  end(ext('y', 1), W / 2 + 8, 16, 'start'); end(ext('y', -1), W / 2 + 8, H - 6, 'start');
  for (const b of map.books) {
    const bk = bookOf[b.id]; if (!bk) continue;
    const g = S('g', { class: 'bk', 'data-tip': `${bk.title} · club average ${b.mean.toFixed(1)}` }, svg);
    const x = X(b.x, bx), y = Y(b.y, by);
    if (bk.cover_url) S('image', { href: bk.cover_url, x: x - 9, y: y - 13.5, width: 18, height: 27, preserveAspectRatio: 'xMidYMid slice' }, g);
    else S('rect', { x: x - 9, y: y - 13.5, width: 18, height: 27, fill: 'var(--rule)' }, g);
  }
  for (const m of map.members) {
    const g = S('g', { class: `who${me?.id === m.id ? ' me' : ''}`, 'data-tip': nameOf[m.id] }, svg);
    const x = X(m.x, mx), y = Y(m.y, my);
    S('circle', { cx: x, cy: y, r: 7 }, g);
    S('text', { x: x + 11, y: y + 4 }, g).textContent = nameOf[m.id];
  }
  return svg;
}

function predictions(memberId) {
  const list = predict(entries, memberId).filter((p) => bookOf[p.book_id]);
  if (!list.length) {
    const scored = new Set(entries.filter((e) => e.member_id === memberId && RANKED.includes(e.tier)).map((e) => e.book_id));
    const readAll = books.every((b) => scored.has(b.id));
    if (readAll) return el('p.muted', me?.id === memberId ? "You've read every book." : `${nameOf[memberId]} has read every book.`);
    return el('p.muted', 'Nothing to predict: rank a few books first, or there is nobody to compare with yet.');
  }
  return el('div.pred', list.map((p) => el('div.book',
    el('span.tierchip', p.tier), thumb(bookOf[p.book_id].cover_url),
    el('span', el('a', { href: `/members/book?id=${p.book_id}` }, el('cite', bookOf[p.book_id].title)),
      el('span.muted.small', ` · from ${p.basis} member${p.basis === 1 ? '' : 's'}`)))));
}

if (!map) {
  main.replaceChildren(el('h1', 'Taste map'), el('p.muted', 'Needs at least three members with tier lists.'));
} else {
  const who = el('select', {}, map.members.map((m) => el('option', { value: m.id, selected: m.id === me?.id }, nameOf[m.id])));
  const pred = el('div');
  const mapBox = el('div');
  let drawn = 0;
  const redraw = () => { const w = Math.round(Math.min(960, mapBox.clientWidth || main.clientWidth)); if (w && w !== drawn) { drawn = w; mapBox.replaceChildren(drawMap(w)); } };
  new ResizeObserver(redraw).observe(mapBox);
  const show = () => pred.replaceChildren(predictions(Number(who.value)));
  who.onchange = show;
  main.replaceChildren(
    el('h1', 'Taste map'),
    el('p.muted', `Members sit near the books they rated above the club average. The axes are the two biggest differences in the club's tier lists (${Math.round(map.spread[0] * 100)}% and ${Math.round(map.spread[1] * 100)}% of the variation), each labeled by its most extreme book.`),
    mapBox,
    el('h2', 'Predicted tiers'),
    el('div.pick', el('label', { htmlFor: 'who' }, 'For'), who),
    pred);
  who.id = 'who';
  show();
}
</script>
<script src="/nav.js" defer></script>
</body>
</html>
