<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book · GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/" aria-label="GEB Club"><canvas aria-hidden="true"></canvas></a>
  <a href="/history">History</a>
  <a href="/members/">Members</a>
</nav></header>
<main id="main"><p class="muted">Loading…</p></main>
<script type="module">
import { api, el, bookLinks, getMe, who } from './app.js';

const id = new URLSearchParams(location.search).get('id');
const main = document.getElementById('main');

async function load() {
  const [{ book, notes, favoriteOf }, me] = await Promise.all([api(`/api/books/${id}`), getMe()]);
  document.title = `${book.title} · GEB Club`;
  const mine = notes.find((n) => n.member_id === me?.id);
  const others = notes.filter((n) => n !== mine);

  let editor;
  if (me) {
    const text = el('textarea', { id: 'note', rows: 5, style: 'width:100%', value: mine?.note ?? '' });
    const msg = el('p.error.small', { role: 'alert' });
    editor = el('form',
      el('label', { htmlFor: 'note' }, 'Your note'), text,
      el('p', el('button', 'Save'), mine && [' ', el('button.secondary', { type: 'button', onclick: async () => {
        if (!confirm('Delete your note?')) return;
        await api(`/api/books/${book.id}/note`, { method: 'PUT', body: { note: '' } });
        load();
      } }, 'Delete')]),
      msg);
    editor.addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await api(`/api/books/${book.id}/note`, { method: 'PUT', body: { note: text.value } }); load(); }
      catch (err) { msg.textContent = err.message; }
    });
  } else {
    editor = el('p', el('a', { href: '/members/' }, 'Sign in'), ' to add a note.');
  }

  const noteCard = (n) => el('div.card',
    el('div.small', el('a', { href: `/members/member?id=${n.member_id}` }, el('strong', who(n.name))), el('span.muted', ` · ${n.updated_at.slice(0, 10)}`)),
    el('p.note', n.note));

  main.replaceChildren(...[
    el('p.small.back', el('a', { href: '/members/' }, '← Members')),
    el('div.book-head',
      book.cover_url ? el('img.cover', { src: book.cover_url, alt: '', className: book.cover_url.endsWith('#crop') ? 'cover crop' : 'cover' }) : '',
      el('div',
        el('h1', el('cite', book.title)),
        el('p.muted', [`#${book.position}`, book.author, book.nominator && book.nominator !== 'none' ? `nominated by ${book.nominator}` : null, book.read_date].filter(Boolean).join(' · ')),
        book.notes ? el('p.small', book.notes) : '',
        bookLinks(book))),
    favoriteOf.length ? el('p.small', 'Favorite of ', favoriteOf.join(', ')) : '',
    el('h2', `Notes (${notes.length})`),
    others.map(noteCard),
    mine ? noteCard(mine) : '',
    editor,
  ].flat(Infinity).filter((n) => n != null && n !== ''));
}

load().catch((err) => main.replaceChildren(el('p.error', err.message)));
</script>
<script src="/nav.js" defer></script>
</body>
</html>
