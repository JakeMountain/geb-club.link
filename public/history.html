<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/" aria-label="GEB Club"><canvas aria-hidden="true"></canvas></a>
  <a href="/history" aria-current="page">History</a>
  <a href="/members/">Members</a>
</nav></header>
<main class="wide">
  <h1>History</h1>
  <ol class="shelf" id="books"><li class="muted">Loading…</li></ol>
</main>
<script>
const make = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const sgSearch = (b) => `https://app.thestorygraph.com/browse?search_term=${encodeURIComponent([b.title, b.author].filter(Boolean).join(' '))}`;
fetch('/api/public/books').then(r => r.json()).then(books => {
  document.getElementById('books').replaceChildren(...books.map(b => make('li', {},
    make('a', { className: 'book-tile', href: b.storygraph_url || sgSearch(b), target: '_blank', rel: 'noopener',
        title: `${b.title}${b.author ? ' · ' + b.author : ''} (StoryGraph)` },
      make('div', { className: 'cover-wrap' },
        b.cover_url ? make('img', { src: b.cover_url, alt: '', loading: 'lazy', className: b.cover_url.endsWith('#crop') ? 'crop' : '' }) : make('span', { className: 'no-cover' }, b.title)),
      make('div', { className: 'tile-num' }, String(b.position)),
      make('div', { className: 'tile-title' }, b.title),
      make('div', { className: 'tile-author' }, b.author || '')))));
});
</script>
<script src="/nav.js" defer></script>
</body>
</html>
