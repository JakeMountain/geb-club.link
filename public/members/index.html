<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members · GEB Club</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header class="site"><nav>
  <a class="brand" href="/" aria-label="GEB Club"><canvas aria-hidden="true"></canvas></a>
  <a href="/history">History</a>
  <a href="/voting">How we vote</a>
  <a href="/members/" aria-current="page">Members</a>
</nav></header>
<main class="wide">
  <h1>Members</h1>

  <section id="account"></section>

  <h2>Members</h2>
  <div class="table-wrap" id="members"><p class="muted">Loading…</p></div>

  <h2>History</h2>
  <ol class="shelf" id="history"><li class="muted">Loading…</li></ol>

</main>
<script type="module">
import { api, el, fmt, pill, getMe } from './app.js';

let me = null;

// ---------------------------------------------------------------- account
function errorLine() { return el('p.error.small', { role: 'alert' }); }

function onSubmit(form, fn, msg) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    try { await fn(); } catch (err) { msg.textContent = err.message; }
  });
  return form;
}

async function renderAccount() {
  const box = document.getElementById('account');
  if (me) {
    box.replaceChildren(
      el('p', 'Signed in as ', el('strong', me.name), ' · ',
        el('a', { href: '/members/me' }, 'My page'), ' · ',
        el('button.link', { type: 'button', onclick: async () => {
          await api('/api/accounts/logout', { method: 'POST' });
          me = null; dispatchEvent(new CustomEvent('geb:account', { detail: null })); renderAccount();
        } }, 'Switch account')));
    return;
  }

  const members = await api('/api/members');
  const inMsg = errorLine(), upMsg = errorLine();
  const who = el('select', { id: 'si-who', required: true, style: 'width:100%' },
    el('option', { value: '' }, ''), members.map((m) => el('option', { value: m.id }, m.name)));
  const inPw = el('input', { type: 'password', id: 'si-pw', autocomplete: 'current-password', style: 'width:100%' });
  const upFirst = el('input', { id: 'su-first', maxLength: 40, autocomplete: 'given-name', style: 'width:100%' });
  const upDiscord = el('input', { id: 'su-discord', maxLength: 40, autocomplete: 'username', style: 'width:100%' });
  const upPw = el('input', { type: 'password', id: 'su-pw', autocomplete: 'new-password', style: 'width:100%' });

  const signedIn = (r) => { me = r.me; dispatchEvent(new CustomEvent('geb:account', { detail: me })); renderAccount(); loadMembers(); };
  box.replaceChildren(
    members.length ? el('div.card', el('h3', 'Sign in'), onSubmit(el('form',
      el('div.row',
        el('div', el('label', { htmlFor: 'si-who' }, 'Name'), who),
        el('div', el('label', { htmlFor: 'si-pw' }, 'Password (if set)'), inPw),
        el('button', 'Sign in')),
      inMsg), async () => signedIn(await api('/api/accounts/login', { method: 'POST', body: { member_id: Number(who.value), password: inPw.value } })), inMsg)) : '',
    el('div.card', el('h3', 'Create an account'), onSubmit(el('form',
      el('div.row',
        el('div', el('label', { htmlFor: 'su-first' }, 'First name'), upFirst),
        el('div', el('label', { htmlFor: 'su-discord' }, 'Discord handle'), upDiscord)),
      el('div.row',
        el('div', el('label', { htmlFor: 'su-pw' }, 'Password (optional)'), upPw),
        el('button', 'Create')),
      el('p.muted.small', 'First name or Discord handle required.'),
      upMsg), async () => signedIn(await api('/api/accounts', { method: 'POST', body: { first_name: upFirst.value, discord: upDiscord.value, password: upPw.value } })), upMsg)));
}

// ---------------------------------------------------------------- data
async function loadHistory() {
  const books = await api('/api/books');
  document.getElementById('history').replaceChildren(...books.map((b) => el('li',
    el('a.book-tile', { href: `/members/book?id=${b.id}`, title: b.notes || b.title },
      el('div.cover-wrap', b.cover_url ? el('img', { src: b.cover_url, alt: '', loading: 'lazy', className: b.cover_url.endsWith('#crop') ? 'crop' : '' }) : el('span.no-cover', b.title)),
      el('div.tile-num', String(b.position)),
      el('div.tile-title', b.title),
      el('div.tile-author', b.author ?? ''),
      el('div.tile-meta', [
        b.nominator && b.nominator !== 'none' ? `Nominated by ${b.nominator}` : null,
        b.n_notes ? `${b.n_notes} note${b.n_notes === 1 ? '' : 's'}` : null,
      ].filter(Boolean).join(' · '))))));
}

async function loadMembers() {
  const [members, { members: standings }] = await Promise.all([api('/api/members'), api('/api/standings')]);
  const box = document.getElementById('members');
  if (!members.length) { box.replaceChildren(el('p.muted', 'None')); return; }
  const st = Object.fromEntries(standings.map((x) => [x.id, x]));
  box.replaceChildren(el('table',
    el('tr', el('th', 'Member'), el('th', 'Favorite'), el('th', 'Profiles'), el('th.num', 'Debt'), el('th.num', 'Weight')),
    [...members].sort((a, b) => (st[b.id]?.weight ?? 0) - (st[a.id]?.weight ?? 0) || a.name.localeCompare(b.name)).map((m) => el('tr',
      el('td', el('a', { href: `/members/member?id=${m.id}` }, m.name), me?.id === m.id ? el('span.muted.small', ' (you)') : ''),
      el('td.small', m.favorite_book_id ? el('a', { href: `/members/book?id=${m.favorite_book_id}` }, el('cite', m.favorite_title)) : ''),
      el('td.small.links',
        m.storygraph_url && el('a', { href: m.storygraph_url, target: '_blank', rel: 'noopener' }, 'StoryGraph'),
        m.goodreads_url && el('a', { href: m.goodreads_url, target: '_blank', rel: 'noopener' }, 'Goodreads')),
      el('td.num', st[m.id] ? fmt(st[m.id].debt) : ''),
      el('td.num', st[m.id] ? el('strong', fmt(st[m.id].weight)) : '')))));
}

me = await getMe();
renderAccount();
loadHistory(); loadMembers();
</script>
<script src="/nav.js" defer></script>
</body>
</html>
